# nginx in front of the Nibras app (Node on 127.0.0.1:3000). certbot adds the HTTPS parts.
# One app answers every address: www (site and customers), staff (owner and staff).

# nibras-ac.com -> www.nibras-ac.com
server {
    listen 80;
    listen [::]:80;
    server_name nibras-ac.com;
    return 301 https://www.nibras-ac.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.nibras-ac.com staff.nibras-ac.com;

    # uploads are 4 MB at most; a little room for the form around them
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
