<!DOCTYPE html>
<!--
  Specialty cover template. render.py opens it as cover.html?key=<specialty>&lang=ar|en
  and screenshots it at 1200x750. A photo at photos/<key>.jpg fills the image side;
  without one, a branded wine panel with the specialty icon stands in.
-->
<html>
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@500;600&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@500;600&display=block" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    :root {
      --primary: #5a020e; --primary-hover: #7a0f20; --primary-dark: #2f0108;
      --gold: #b98a35; --gold-bright: #e0bc72; --gold-dark: #8a6420;
      --ivory: #fbf7f0; --muted: #62555a;
      --display: 'El Messiri', 'IBM Plex Sans Arabic', serif;
      --body: 'IBM Plex Sans Arabic', sans-serif;
    }
    [lang="en"] { --display: 'Fraunces', Georgia, serif; --body: 'IBM Plex Sans', sans-serif; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 750px; overflow: hidden; }
    body { position: relative; font-family: var(--body); background: var(--ivory); }

    /* Image side: the end of the reading direction */
    .media { position: absolute; inset-block: 0; inset-inline-end: 0; width: 64%; }
    .media img { width: 100%; height: 100%; object-fit: cover; }
    [dir="rtl"] .media { -webkit-mask-image: linear-gradient(to left, transparent 0, #000 30%); }
    [dir="ltr"] .media { -webkit-mask-image: linear-gradient(to right, transparent 0, #000 30%); }
    /* No photo yet: an arched wine panel, echoing the arches of the emblem */
    [dir] .media--fallback { -webkit-mask-image: none; width: 46%; inset-block-start: 40px; border-start-start-radius: 300px; border-start-end-radius: 0; display: grid; place-items: center; overflow: hidden; background: radial-gradient(90% 120% at 50% 100%, var(--primary-hover) 0, var(--primary) 45%, var(--primary-dark) 100%); box-shadow: inset 0 0 0 1px rgba(224, 188, 114, .35); }    .media--fallback::before { content: ''; position: absolute; inset: 0; background: url('../../assets/img/arches.svg') center bottom / 160% auto no-repeat; opacity: .9; }
    .media--fallback i { position: relative; font-size: 190px; color: var(--gold-bright); opacity: .92; }

    /* Text side. The top start corner stays clear for the level badge the site lays over covers */
    .copy { position: absolute; inset-block: 0; inset-inline-start: 0; width: 50%; display: flex; flex-direction: column; justify-content: center; padding-block: 120px 120px; padding-inline: 70px 20px; }
    .kicker { font-size: 25px; font-weight: 600; color: var(--gold-dark); margin-bottom: 14px; }
    h1 { font-family: var(--display); font-size: 74px; font-weight: 700; line-height: 1.22; color: var(--primary-dark); text-wrap: balance; margin-bottom: 26px; }
    [lang="en"] h1 { font-size: 64px; line-height: 1.12; }
    .tagline { align-self: flex-start; padding: 12px 24px; border-radius: 14px; font-size: 27px; font-weight: 600; line-height: 1.45; color: #fff; background: var(--primary); box-shadow: 0 14px 30px -14px rgba(47, 1, 8, .55); }

    .foot { position: absolute; inset-block-end: 34px; inset-inline-start: 70px; display: flex; align-items: center; gap: 14px; font-size: 22px; font-weight: 600; color: var(--primary-dark); }
    .foot img { width: 54px; height: 54px; }
    .foot .sep { width: 1px; height: 30px; background: var(--gold); opacity: .6; }
    .foot .domain { display: flex; align-items: center; gap: 8px; direction: ltr; font-family: 'IBM Plex Sans', var(--body); color: var(--primary); }
    .foot .domain i { color: var(--gold); font-size: 19px; }
  </style>
</head>
<body>
  <div class="media" id="media"></div>
  <div class="copy">
    <p class="kicker" id="kicker"></p>
    <h1 id="title"></h1>
    <p class="tagline" id="tagline"></p>
  </div>
  <div class="foot">
    <img src="../../assets/img/logo.png" alt="" />
    <span id="brand"></span>
    <span class="sep"></span>
    <span class="domain"><i class="fas fa-globe"></i>nibras-ac.com</span>
  </div>

  <script src="../../assets/js/specialties.js"></script>
  <script>
    const TAGLINES = {
      business: ['من الفكرة إلى إدارة مؤسسة ناجحة', 'From idea to a thriving organization'],
      leadership: ['قيادة تُلهم الفرق وتصنع القرار', 'Lead teams and shape decisions'],
      strategy: ['خطط اليوم لنتائج الغد', "Plan today for tomorrow's results"],
      projects: ['من التخطيط إلى التسليم بثقة', 'From planning to delivery, with confidence'],
      hr: ['استثمر في أهم أصول المؤسسة: الإنسان', "Invest in the organization's people"],
      finance: ['أرقام دقيقة لقرارات أذكى', 'Accurate numbers, smarter decisions'],
      marketing: ['افهم عميلك... وضاعف مبيعاتك', 'Know your customer, grow your sales'],
      customer: ['تجربة عميل تصنع الولاء', 'Customer experiences that build loyalty'],
      risk: ['توقّع المخاطر قبل أن تحدث', 'See risks before they happen'],
      governance: ['حوكمة رشيدة لمؤسسات مستدامة', 'Sound governance, sustainable organizations'],
      quality: ['جودة تُقاس وتحسين لا يتوقف', 'Measured quality, continuous improvement'],
      health: ['إدارة أكفأ لرعاية صحية أفضل', 'Better management, better care'],
      safety: ['بيئة عمل آمنة تبدأ بالمعرفة', 'A safe workplace starts with knowledge'],
      supply: ['سلاسل إمداد أذكى وأسرع', 'Smarter, faster supply chains'],
      hospitality: ['ضيافة احترافية تصنع الانطباع الأول', 'Hospitality that makes the first impression'],
      pr: ['صوت مؤسستك... بثقة واحتراف', "Your organization's voice, with confidence"],
      data: ['حوّل البيانات إلى قرارات', 'Turn data into decisions'],
      ai: ['الذكاء الاصطناعي في خدمة عملك', 'Put AI to work in your role'],
      cyber: ['احمِ بيانات مؤسستك بثقة', "Protect your organization's data"],
      digital: ['قُد التحول الرقمي في مؤسستك', 'Lead the digital shift in your organization'],
      professional: ['طوّر مهاراتك لخطوتك المهنية التالية', 'Build the skills for your next step']
    };

    const params = new URLSearchParams(location.search);
    const lang = params.get('lang') === 'en' ? 'en' : 'ar';
    const spec = NIBRAS_SPECIALTIES.byKey(params.get('key'));
    const isEN = lang === 'en';

    document.documentElement.lang = lang;
    document.documentElement.dir = isEN ? 'ltr' : 'rtl';
    document.getElementById('kicker').textContent = isEN ? 'Your next career step' : 'خطوتك القادمة في مسارك المهني';
    document.getElementById('title').textContent = spec[lang];
    document.getElementById('tagline').textContent = (TAGLINES[spec.key] || TAGLINES.professional)[isEN ? 1 : 0];
    document.getElementById('brand').textContent = isEN ? 'Nibras Academy' : 'أكاديمية نبراس';

    const media = document.getElementById('media');
    const photo = new Image();
    photo.onload = () => { media.appendChild(photo); document.body.dataset.ready = '1'; };
    photo.onerror = () => {
      media.classList.add('media--fallback');
      media.innerHTML = `<i class="fas ${spec.icon}"></i>`;
      document.body.dataset.ready = '1';
    };
    photo.src = `photos/${spec.key}.jpg`;
  </script>
</body>
</html>
