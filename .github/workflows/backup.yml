# Daily encrypted backup of the live database.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   BACKUP_MONGO_URI      connection string of the live database (a read-only database user is enough)
#   BACKUP_PASSPHRASE     long random passphrase; without it the backup cannot be opened. Keep a copy offline.
# Optional, to also keep a copy in the academy's Cloudflare R2 bucket (otherwise GitHub keeps 30 days):
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET
#
# The archive is encrypted before it leaves the runner, because artifacts of a public repository
# can be downloaded by other GitHub users. Restore steps: docs/BACKUP-RESTORE.md

name: Database backup

on:
  schedule:
    - cron: '30 0 * * *'   # 00:30 UTC = 02:30 Cairo, 03:30 Riyadh
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check settings
        env:
          URI: ${{ secrets.BACKUP_MONGO_URI }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$URI" ] || [ -z "$PASS" ]; then
            echo "BACKUP_MONGO_URI and BACKUP_PASSPHRASE must be set as repository secrets." >&2
            exit 1
          fi

      - name: Install MongoDB database tools
        run: |
          wget -q https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-100.10.0.deb
          sudo apt-get install -y ./mongodb-database-tools-ubuntu2204-x86_64-100.10.0.deb

      - name: Dump and encrypt
        env:
          URI: ${{ secrets.BACKUP_MONGO_URI }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y-%m-%dT%H%MZ)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          mongodump --uri="$URI" --archive=nibras.archive --gzip
          ls -l nibras.archive
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in nibras.archive -out "nibras-$STAMP.archive.gz.enc" -pass env:PASS
          sha256sum "nibras-$STAMP.archive.gz.enc" > "nibras-$STAMP.sha256"
          rm nibras.archive

      - name: Keep in GitHub (30 days)
        uses: actions/upload-artifact@v4
        with:
          name: nibras-backup-${{ env.STAMP }}
          path: |
            nibras-*.enc
            nibras-*.sha256
          retention-days: 30

      - name: Copy to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        if: env.R2_ACCOUNT_ID != ''
        run: |
          aws s3 cp nibras-*.enc "s3://$R2_BUCKET/backups/" --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          aws s3 cp nibras-*.sha256 "s3://$R2_BUCKET/backups/" --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
